[project]
name = "radgym"
version = "0.1.0a0"
description = "Open agentic benchmark for radiology workflow reasoning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kareem", email = "kareem@radgym.local" }]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
baselines = [
    "litellm>=1.50",
    "tenacity>=8.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["radgym*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
